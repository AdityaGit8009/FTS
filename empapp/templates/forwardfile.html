{% extends 'empbase.html' %}
{% load static %}
{% block employee %}

<div class="row align-items-center mb-4">
  <div class="col-sm-6">
    <div class="d-flex align-items-center gap-3">
      <div class="theme-icon-wrapper bg-light-primary p-2 rounded">
        <i class="ti ti-arrow-right text-primary" style="font-size: 2rem;"></i>
      </div>
      <div>
        <h3 class="mb-0 fw-bold">Forward File</h3>
        <p class="text-muted mb-0">Select department and employee to hand over the file</p>
      </div>
    </div>
  </div>
  <div class="col-sm-6 text-sm-end mt-3 mt-sm-0">
    <a href="{% url 'viewfiles' %}" class="btn btn-secondary">
      <i class="ti ti-arrow-left me-1"></i> Back to Dashboard
    </a>
  </div>
</div>

<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
      <div class="card-header bg-transparent border-0 pt-4 px-4">
        <h5 class="mb-0 fw-bold">Forward File: <span class="text-primary">{{ file.file_no }}</span></h5>
        <p class="text-muted small mb-0">Title: <strong>{{ file.title }}</strong></p>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}
          
          <div class="row g-3">
            <!-- Department Selection -->
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-semibold text-dark">Target Department</label>
                <select id="dept_select" class="form-select" required>
                  <option value="">-- Choose Department --</option>
                  {% for dept in departments %}
                  <option value="{{ dept.id }}">{{ dept.dept_name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <!-- Employee Selection -->
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-semibold text-dark">Target Assignee (Employee)</label>
                <select id="emp_select" name="emp_id" class="form-select" disabled>
                  <option value="">-- Select Department First --</option>
                </select>
              </div>
            </div>

            <!-- Remarks -->
            <div class="col-md-12">
              <div class="form-group mb-4">
                <label class="form-label fw-semibold text-dark">Transfer Remarks / Reason</label>
                <textarea name="remarks" rows="3" class="form-control" placeholder="Write remarks here explaining why this file is forwarded..." required></textarea>
              </div>
            </div>

            <div class="col-12 text-end">
              <button type="submit" class="btn btn-primary px-4 py-2">
                <i class="ti ti-send me-1"></i> Forward File
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .bg-light-primary {
    background-color: rgba(99, 102, 241, 0.1) !important;
  }
</style>

<!-- JS for Dynamic Dropdowns Filtering -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const deptSelect = document.getElementById('dept_select');
    const empSelect = document.getElementById('emp_select');

    const employees = [
      {% for employee in employees %}
      {
        id: "{{ employee.id }}",
        name: "{{ employee.name }}",
        designation: "{{ employee.designation }}",
        deptId: "{{ employee.department.id }}"
      },
      {% endfor %}
    ];

    deptSelect.addEventListener('change', function() {
      const selectedDeptId = this.value;
      empSelect.innerHTML = '<option value="">-- Select Employee --</option>';

      if (selectedDeptId) {
        const filteredEmps = employees.filter(emp => emp.deptId === selectedDeptId);
        
        if (filteredEmps.length > 0) {
          filteredEmps.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.id;
            option.textContent = `${emp.name} (${emp.designation})`;
            empSelect.appendChild(option);
          });
          empSelect.disabled = false;
          empSelect.required = true;
        } else {
          empSelect.innerHTML = '<option value="">No employees found in this department</option>';
          empSelect.disabled = true;
          empSelect.required = false;
        }
      } else {
        empSelect.innerHTML = '<option value="">-- Select Department First --</option>';
        empSelect.disabled = true;
        empSelect.required = false;
      }
    });
  });
</script>

{% endblock %}
