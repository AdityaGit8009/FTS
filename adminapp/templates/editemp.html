{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="row align-items-center mb-4">
  <div class="col-sm-6">
    <div class="d-flex align-items-center gap-3">
      <div class="theme-icon-wrapper bg-light-primary p-2 rounded">
        <i class="ti ti-edit text-primary" style="font-size: 2rem;"></i>
      </div>
      <div>
        <h3 class="mb-0 fw-bold">Edit Employee</h3>
        <p class="text-muted mb-0">Modify registration details for employee: {{ emp.name }}</p>
      </div>
    </div>
  </div>
  <div class="col-sm-6 text-sm-end mt-3 mt-sm-0">
    <a href="{% url 'viewemp' %}" class="btn btn-outline-secondary">
      <i class="ti ti-arrow-left me-1"></i> Back to List
    </a>
  </div>
</div>

<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
      <div class="card-header bg-transparent border-0 pt-4 px-4">
        <h5 class="mb-0 fw-bold">Employee Account Details</h5>
      </div>
      <div class="card-body p-4">
        <form method="post" class="row g-4">
          {% csrf_token %}
          
          <!-- Employee ID -->
          <div class="col-sm-6">
            <label for="empid" class="form-label">Employee ID</label>
            <input type="text" class="form-control" name="empid" id="empid" value="{{ emp.empid }}" required>
          </div>

          <!-- Employee Name -->
          <div class="col-sm-6">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" id="name" value="{{ emp.name }}" required>
          </div>

          <!-- Contact No -->
          <div class="col-sm-6">
            <label for="contactno" class="form-label">Contact Number</label>
            <input type="text" class="form-control" name="contactno" id="contactno" value="{{ emp.contactno }}" required>
          </div>

          <!-- Email (Username) -->
          <div class="col-sm-6">
            <label for="email" class="form-label">Email Address (Username)</label>
            <input type="email" class="form-control" name="email" id="email" value="{{ emp.email }}" required>
          </div>

          <!-- Designation -->
          <div class="col-sm-6">
            <label for="designation" class="form-label">Designation</label>
            <input type="text" class="form-control" name="designation" id="designation" value="{{ emp.designation }}" required>
          </div>

          <!-- Department Select -->
          <div class="col-sm-6">
            <label for="dept_id" class="form-label">Department</label>
            <select name="dept_id" id="dept" class="form-select" required>
              {% for d in depts %}
                <option value="{{ d.id }}" {% if d.id == emp.department.id %}selected{% endif %}>{{ d.dept_name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Reset Password -->
          <div class="col-sm-6">
            <label for="password" class="form-label">Reset Password (leave blank to keep current)</label>
            <input type="password" class="form-control" name="password" id="password" placeholder="Enter new password">
          </div>

          <!-- Form Actions -->
          <div class="col-12 text-end mt-4">
            <a href="{% url 'viewemp' %}" class="btn btn-light-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="ti ti-device-floppy me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .bg-light-primary {
    background-color: rgba(99, 102, 241, 0.1) !important;
  }
  .bg-light-secondary {
    background-color: rgba(108, 117, 125, 0.1) !important;
  }
</style>

{% endblock %}
