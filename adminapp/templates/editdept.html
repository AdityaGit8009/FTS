{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}

<div class="row align-items-center mb-4">
  <div class="col-sm-6">
    <div class="d-flex align-items-center gap-3">
      <div class="theme-icon-wrapper bg-light-primary p-2 rounded">
        <i class="ti ti-edit text-primary" style="font-size: 2rem;"></i>
      </div>
      <div>
        <h3 class="mb-0 fw-bold">Edit Department</h3>
        <p class="text-muted mb-0">Rename department: {{ dept.dept_name }}</p>
      </div>
    </div>
  </div>
  <div class="col-sm-6 text-sm-end mt-3 mt-sm-0">
    <a href="{% url 'viewdept' %}" class="btn btn-outline-secondary">
      <i class="ti ti-arrow-left me-1"></i> Back to List
    </a>
  </div>
</div>

<div class="row">
  <div class="col-md-6 mx-auto">
    <div class="card border-0 shadow-sm" style="border-radius: 12px;">
      <div class="card-header bg-transparent border-0 pt-4 px-4">
        <h5 class="mb-0 fw-bold">Department Profile</h5>
      </div>
      <div class="card-body p-4">
        <form method="post" class="g-3">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="dept_name" class="form-label">Department Name</label>
            <input type="text" class="form-control" name="dept_name" id="dept_name" value="{{ dept.dept_name }}" required>
          </div>

          <div class="text-end mt-4">
            <a href="{% url 'viewdept' %}" class="btn btn-light-secondary me-2">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="ti ti-device-floppy me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .bg-light-primary {
    background-color: rgba(99, 102, 241, 0.1) !important;
  }
  .bg-light-secondary {
    background-color: rgba(108, 117, 125, 0.1) !important;
  }
</style>

{% endblock %}
